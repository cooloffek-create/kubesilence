[project]
name = "kubesilence"
version = "0.1.0"
description = "AlertOps-Reducer: Combat alert fatigue in CloudOps/DevOps environments."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    {name = "Odin", email = "odin@example.com"},
]
license = {text = "MIT"}
keywords = ["devops", "alerting", "opsgenie", "datadog", "monitoring", "cli"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: System Administrators",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "pandas>=2.0",
    "rapidfuzz>=3.0",
    "tenacity>=8.0",
    "rich>=13.0",
    "typer>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.0",
    "pytest-asyncio>=1.0",
]

[project.urls]
Homepage = "https://github.com/nousresearch/kubesilence"
Repository = "https://github.com/nousresearch/kubesilence"

[project.scripts]
kubesilence = "kubesilence.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
packages = ["src/kubesilence"]

[tool.hatch.build.targets.wheel]
packages = ["src/kubesilence"]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.5",
    "mypy>=1.10",
]
